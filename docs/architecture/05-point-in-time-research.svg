<text x="890" y="597.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">All screener, company, comparison and explanation responses identify the</text>
<text x="890" y="622.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">research snapshot, coverage and relevant market-data time. Build projections</text>

<text x="66" y="1041.3" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#117F82" font-weight="700">TEMPORAL RULE</text>
<text x="66" y="1063.66" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#52677C" font-weight="400">Source-publication time controls eligibility; retrieval time records when the platform learned it. Historical reconstruction is labelled. Later amendments do not rewrite older research.</text>
<text x="48" y="1119.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#52677C" font-weight="400">History, audit records and outbox events are retained; full event sourcing is not required for this design.</text>

<text x="86" y="538.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Access + data separation</text>
<text x="86" y="567.12" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">Investor / analyst / admin roles; account-scoped saved</text>
<text x="86" y="589.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">research; common financial evidence kept separate</text>
<text x="86" y="611.28" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">from private user data.</text>
<rect x="603" y="504" width="494" height="188" rx="12" fill="#E9F6F3" stroke="#117F82" stroke-width="1.2"/>
<rect x="603" y="519" width="4" height="158" rx="0" fill="#117F82" stroke="none" stroke-width="1.2"/>
<text x="621" y="538.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Observability + freshness</text>
<text x="621" y="567.12" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">Trace API request -&gt; job -&gt; research run; monitor lag,</text>
<text x="621" y="589.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">parser failures, coverage changes, model shifts and</text>
<text x="621" y="611.28" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">serving errors.</text>
<rect x="1138" y="504" width="494" height="188" rx="12" fill="#E9F6F3" stroke="#117F82" stroke-width="1.2"/>
<rect x="1138" y="519" width="4" height="158" rx="0" fill="#117F82" stroke="none" stroke-width="1.2"/>
<text x="1156" y="538.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Recovery + controlled release</text>
<text x="1156" y="567.12" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">Database point-in-time recovery; evidence/artifact</text>
<text x="1156" y="589.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">backups; restore drills; CI checks; staging; versioned</text>
<text x="1156" y="611.28" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#52677C" font-weight="400">model promotion and rollback.</text>
<text x="48" y="776.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#117F82" font-weight="700">LAUNCH NOW</text>
<text x="872" y="776.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#2463AA" font-weight="700">SCALE WHEN MEASUREMENTS JUSTIFY IT</text>
<rect x="48" y="803" width="774" height="245" rx="12" fill="#E9F6F3" stroke="#117F82" stroke-width="1.2"/>
<rect x="48" y="818" width="4" height="215" rx="0" fill="#117F82" stroke="none" stroke-width="1.2"/>
<text x="66" y="837.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Small, deliberate deployment</text>
<text x="66" y="867.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">One modular backend; independently runnable workers; PostgreSQL</text>
<text x="66" y="892.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">facts/features/read projections; object storage; durable job table or managed</text>
<text x="66" y="917.4399999999999" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">queue. PostgreSQL full-text search first. AI is a replaceable provider adapter.</text>
<rect x="872" y="803" width="780" height="245" rx="12" fill="#EAF2FD" stroke="#2463AA" stroke-width="1.2"/>
<rect x="872" y="818" width="4" height="215" rx="0" fill="#2463AA" stroke="none" stroke-width="1.2"/>
<text x="890" y="837.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Preserve the same domain contracts</text>
<text x="890" y="867.76" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">Add worker replicas for backlog; dedicated cache/read replicas for query</text>
<text x="890" y="892.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">pressure; a search service for retrieval load; an analytical warehouse for large</text>
<text x="890" y="917.4399999999999" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">cohort scans. Extract a service only for measured isolation, scaling or ownership</text>
<text x="890" y="942.28" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#52677C" font-weight="400">needs.</text>
<text x="48" y="1101.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#52677C" font-weight="400">Proposed targets to validate: fast reads from published projections; explicit freshness labels; no duplicate publications; graceful use of the last valid snapshot.</text>
<text x="48" y="1126.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#117F82" font-weight="700">Heavy extraction, model execution and optional AI inference remain off the synchronous browsing path.</text>
</svg>
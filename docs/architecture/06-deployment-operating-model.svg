<text x="1138" y="254.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#142B43" font-weight="700">Managed data services</text>
<text x="1138" y="283.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">PostgreSQL schemas; durable jobs/queue; private object</text>
<text x="1138" y="307.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">storage. Secrets and service identities scoped by role.</text>

<text x="602" y="254.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#142B43" font-weight="700">Private application runtime</text>
<text x="602" y="283.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">Modular Python API; separate data and intelligence</text>
<text x="602" y="307.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">worker processes; scheduler/outbox dispatcher.</text>

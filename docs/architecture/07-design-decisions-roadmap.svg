<text x="1302" y="248.02" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#117F82" font-weight="700">4 / EXPANSION</text>
<text x="1302" y="275.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Grow coverage and capacity</text>
<text x="1302" y="304.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">Additional sectors / jurisdictions;</text>
<text x="1302" y="328.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">evaluate new models; scale workers</text>
<text x="1302" y="351.86" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">and read services using observed</text>
<text x="1302" y="375.32" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">demand.</text>
<text x="48" y="521.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#117F82" font-weight="700">KEY ARCHITECTURE DECISIONS</text>
<rect x="48" y="546" width="600" height="40" rx="0" fill="#117F82" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="61" y="567.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700">Decision</text>
<rect x="648" y="546" width="1004" height="40" rx="0" fill="#117F82" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="661" y="567.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="700">Why it belongs in this product</text>
<rect x="48" y="586" width="600" height="53" rx="0" fill="#F4F7FA" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="61" y="607.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">C4 context + container + separate logical views</text>
<rect x="648" y="586" width="1004" height="53" rx="0" fill="#F4F7FA" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="661" y="607.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Keep users, runtime units, domain models and deployment concerns explicit.</text>
<rect x="48" y="639" width="600" height="53" rx="0" fill="#FFFFFF" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="61" y="660.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Modular backend + asynchronous workers</text>
<rect x="648" y="639" width="1004" height="53" rx="0" fill="#FFFFFF" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="661" y="660.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Support domain separation and independent compute scaling without a service fleet.</text>
<rect x="48" y="692" width="600" height="53" rx="0" fill="#F4F7FA" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="61" y="713.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Published read projections + immutable snapshots</text>
<rect x="648" y="692" width="1004" height="53" rx="0" fill="#F4F7FA" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="661" y="713.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Fast discovery/comparison; users see one coherent research version with freshness.</text>
<rect x="48" y="745" width="600" height="53" rx="0" fill="#FFFFFF" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="61" y="766.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Versioned peer / factor / valuation policies</text>
<rect x="648" y="745" width="1004" height="53" rx="0" fill="#FFFFFF" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="661" y="766.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Selection and analytical advice can be explained, tested and revised.</text>
<rect x="48" y="798" width="600" height="53" rx="0" fill="#F4F7FA" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="61" y="819.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Point-in-time facts + operand lineage</text>
<rect x="648" y="798" width="1004" height="53" rx="0" fill="#F4F7FA" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="661" y="819.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Reproduce research and prevent later disclosures from leaking into an earlier view.</text>
<rect x="48" y="851" width="600" height="53" rx="0" fill="#FFFFFF" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="61" y="872.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Outbox + idempotent processing</text>
<rect x="648" y="851" width="1004" height="53" rx="0" fill="#FFFFFF" stroke="#B8C7D5" stroke-width="1.2"/>
<text x="661" y="872.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#142B43" font-weight="400">Make source/model changes and downstream refresh recoverable under retries.</text>
<text x="48" y="955.48" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#117F82" font-weight="700">ARCHITECTURE REFERENCES  /  PRIMARY GUIDANCE</text>
<text x="48" y="985.66" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#52677C" font-weight="400">C4: c4model.com/diagrams/system-context and /container  |  Microsoft: Azure Architecture Center /patterns/cqrs</text>
<text x="48" y="1010.66" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#52677C" font-weight="400">AWS Prescriptive Guidance: cloud-design-patterns/transactional-outbox.html  |  Accessed 29 Oct 2026</text>
<rect x="48" y="1045" width="1604" height="71" rx="10" fill="#E9F6F3" stroke="none" stroke-width="1.2"/>
<text x="66" y="1071.3" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#117F82" font-weight="700">DELIVERY PRINCIPLE</text>
<text x="66" y="1093.66" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#52677C" font-weight="400">Validate financial logic, ranking stability, evidence accuracy and user understanding before expanding analytical claims or product scope.</text>

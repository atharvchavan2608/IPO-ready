<text x="66" y="275.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Define the intelligence</text>
<text x="66" y="299.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">contract</text>
<text x="66" y="328.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">Company / offering identities; metric</text>
<text x="66" y="352.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">and factor policies; peer rules;</text>
<text x="66" y="375.86" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">evidence schema; representative</text>
<text x="66" y="399.32" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">reference cases.</text>

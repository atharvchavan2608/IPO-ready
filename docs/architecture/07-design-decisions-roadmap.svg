<text x="478" y="275.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Ship discovery and</text>
<text x="478" y="299.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">comparison</text>
<text x="478" y="328.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">Screener, company pages, peer</text>
<text x="478" y="352.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">comparison, explicit selection criteria,</text>
<text x="478" y="375.86" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">valuation scenarios, evidence and</text>
<text x="478" y="399.32" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">saved shortlists.</text>

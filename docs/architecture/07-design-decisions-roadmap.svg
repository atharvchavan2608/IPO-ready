<text x="890" y="248.02" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2463AA" font-weight="700">3 / AUTOMATION</text>
<text x="890" y="275.58" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#142B43" font-weight="700">Make research repeatable</text>
<text x="890" y="304.94" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">Reliable acquisition / extraction;</text>
<text x="890" y="328.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">exception queue; model approval;</text>
<text x="890" y="351.86" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">published snapshot refresh; watchlist</text>
<text x="890" y="375.32" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#52677C" font-weight="400">changes; cited assistant.</text>
